apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'
//    androidResources {
//        noCompress 'tflite'
//    }

    packagingOptions {
//        jniLibs {
//            pickFirsts += ['**/*.so']
//        }
        jniLibs.useLegacyPackaging true
    }

    // The Control Hub runs a 32-bit userspace, so the arm64-v8a copies of the
    // native libraries are never loaded there -- and they are not small: OpenCV
    // alone ships 20.9 MB of arm64 on top of 15.0 MB of armv7. Dropping arm64
    // takes about 24 MB off the APK, which matters because a Control Hub install
    // has to copy the APK and then run dex2oat over all of it.
    //
    // build.common.gradle sets abiFilters per build type, and build-type values
    // win over defaultConfig, so the override has to happen there too.
    //
    // If you ever need to run the Robot Controller app on a 64-bit phone rather
    // than a Control Hub, add "arm64-v8a" back to these lists.
    buildTypes {
        debug {
            ndk {
                abiFilters.clear()
                abiFilters.add("armeabi-v7a")
            }
        }
        release {
            ndk {
                abiFilters.clear()
                abiFilters.add("armeabi-v7a")
            }
        }
    }
}

dependencies {
    implementation project(':FtcRobotController')

    // valleyLib command-based framework.
    //
    // Pedro Pathing 3 (core + revhub), Panels, and the org.jspecify exclude all
    // arrive through build.dependencies.gradle above, which this module already
    // applies -- valleyLib is the only piece it was missing.
    //
    // Deliberately NOT carried over from Team2844_Season2025: Road Runner,
    // FTC Dashboard and FTCLib. That module needs them for its legacy
    // Road Runner and FTCLib code; this one is a clean start on Pedro 3 and
    // valleyLib, and every unused library is dex and APK weight on a device that
    // is already tight on both. Add them back if you actually import them.
    implementation 'com.github.ValleyX.valleyLib:core:2.0.0'
    implementation 'com.github.ValleyX.valleyLib:ftc:2.0.0'

    // com.pedropathing:tuning (the interactive autotuner the pedro/ package uses)
    // is declared in build.dependencies.gradle, so every module gets it -- it is
    // deliberately not repeated here.
    //
    // Note that means Season2025 and Team12841_Season2026 also pull the tuner and
    // Sloth. To drop it for a competition build, remove it from
    // build.dependencies.gradle and delete pedro/Tuning.java plus
    // pedro/procedures/; Constants.java and the robot code are unaffected.

    // FTC Dashboard. Its own web UI is on port 8000 and Panels' is on 8001/8002,
    // so those do not clash.
    //
    // PINNED AT 0.5.1 ON PURPOSE -- 0.6.0 BRICKS THE CONTROL HUB. DO NOT BUMP.
    //
    // 0.6.0 added a Limelight proxy (com.acmerobotics.dashboard.limelight.
    // LimelightProxyManager) that binds ports 5800, 5801, 5805 and 5807 and
    // forwards them to 172.29.0.1. Panels already does exactly that: the
    // com.bylazar:limelightproxy plugin inside fullpanels binds 5800, 5801 and
    // 5805 to the same target. Two listeners, same ports, same process.
    //
    // Dashboard starts first (@OnCreate, before Panels' attachEventLoop) and
    // wins, so Panels' proxy loses the bind and throws
    //
    //     java.net.BindException: Address already in use
    //         at fi.iki.elonen.NanoHTTPD$ServerRunnable.run
    //
    // on an unnamed worker thread with no handler. An uncaught exception on any
    // thread kills the process, FtcAccessPointService sees the RC go quiet for
    // 10 seconds and relaunches it, and it crashes again -- a permanent restart
    // loop about 55 seconds long. The app installs fine and the hub never comes
    // up, which looks exactly like a bricked hub.
    //
    // 0.5.1 has no Limelight proxy at all, so there is nothing to collide with.
    // It is also what Team2844_Season2025 has been running on these hubs.
    //
    // If you ever want 0.6.0's proxy instead, keep 0.6.0 and drop Panels' copy:
    //     implementation('com.bylazar:fullpanels:1.0.15') {
    //         exclude group: 'com.bylazar', module: 'limelightproxy'
    //     }
    // Untested, and 0.6.0 also drags com.acmerobotics.dashboard:core up to
    // 0.6.0 underneath com.bylazar:panels:1.0.6, which was built against 0.4.7.
    implementation 'com.acmerobotics.dashboard:dashboard:0.5.1'
}
